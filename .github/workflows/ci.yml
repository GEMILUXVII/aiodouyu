name: ci

on:
  push:
    branches: ["master"]
  pull_request:

# 供应链纪律:action 一律 pin 完整 commit SHA(注释保留可读 tag),
# 由 dependabot(github-actions 生态)自动提升
permissions:
  contents: read

jobs:
  lint-test:
    name: Lint & test (py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: pip install -e . pytest pytest-asyncio ruff

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  uvloop-smoke:
    # 固化 "event-loop agnostic" 承诺:代码零 add_reader/loop.sock_*/
    # policy 调用,uvloop 下全量测试必须同样通过
    name: uvloop smoke (py3.13, ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install package with dev dependencies and uvloop
        run: pip install -e . pytest pytest-asyncio uvloop

      - name: Test under uvloop
        # 根级 conftest 覆盖 pytest-asyncio 的 event_loop_policy fixture
        run: |
          cat > conftest.py <<'EOF'
          import pytest
          import uvloop

          @pytest.fixture(scope="session")
          def event_loop_policy():
              return uvloop.EventLoopPolicy()
          EOF
          pytest -q
